name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum-mcp, latest-allowed]
    env:
      SEARCH_PROVIDER: mock
      SHAREPOINT_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.dependencies }}" = "minimum-mcp" ]; then
            python -m pip install -e ".[dev]" "mcp==2.2.0" "jsonschema==4.20.0" "azure-ai-projects==2.7.0"
          else
            python -m pip install -e ".[dev]"
          fi
          python -m pip check
          python -m pip freeze

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/

      - name: Unit and real stdio integration tests
        run: pytest tests/

  validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep
